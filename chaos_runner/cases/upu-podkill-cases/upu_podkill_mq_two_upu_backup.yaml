name: upu_podkill_mq_two_upu_backup

workflow:
  name: wf-upu-podkill-mq-two-upu-backup
  namespace: default

renderer: modular_chaos

targets:
  - id: mq_proxy
    finder: by_label
    label: "app.kubernetes.io/component: dupf-pod-mq-proxy"
  - id: upu_main_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-1"
      - "dupf-pod-upu-2"
      - "dupf-pod-upu-3"
      - "dupf-pod-upu-5"
      - "dupf-pod-upu-6"
      - "dupf-pod-upu-7"
      - "dupf-pod-upu-9"
      - "dupf-pod-upu-10"
      - "dupf-pod-upu-11"

  - id: upu_backup_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-4"
      - "dupf-pod-upu-8"
      - "dupf-pod-upu-12"
stages:
  - mode: parallel
    faults:
      - type: network_delay
        selectors:
          from: mq_proxy
          to: upu_backup_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: mq_proxy
          to: upu_backup_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: pod_kill
        target: mq_proxy
        delay: 0s~1s
        duration: 1s
        expand:
          mode: random
          count: 2
      - type: pod_kill
        target: upu_backup_pool
        delay: 0s~1s
        duration: 1s
        expand:
          mode: random
          count: 1

wait_seconds: 40
cleanup: true
