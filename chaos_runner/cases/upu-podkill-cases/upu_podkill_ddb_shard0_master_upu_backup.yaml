name: upu_podkill_ddb_shard0_master_upu_backup

workflow:
  name: wf-upu-podkill-ddb-shard0-master-upu-backup
  namespace: default

renderer: modular_chaos

targets:
  - id: ddb_shard0_master
    finder: ddb_shard_master
    shard: "0"
  - id: ddb_all
    finder: ddb_pods
    role: all
  - id: upu_main_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-1"
      - "dupf-pod-upu-2"
      - "dupf-pod-upu-3"
      - "dupf-pod-upu-5"
      - "dupf-pod-upu-6"
      - "dupf-pod-upu-7"
      - "dupf-pod-upu-9"
      - "dupf-pod-upu-10"
      - "dupf-pod-upu-11"

  - id: upu_backup_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-4"
      - "dupf-pod-upu-8"
      - "dupf-pod-upu-12"
stages:
  - mode: parallel
    faults:
      - type: network_delay
        selectors:
          from: ddb_all
          to: upu_backup_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: ddb_all
          to: upu_backup_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: pod_kill
        target: ddb_shard0_master
        delay: 0s~1s
        duration: 1s
      - type: pod_kill
        target: upu_backup_pool
        delay: 0s~1s
        duration: 1s
        expand:
          mode: random
          count: 1

wait_seconds: 40
cleanup: true
