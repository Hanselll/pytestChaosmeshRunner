name: upu_ctrkill_rc_follower_upu_backup

workflow:
  name: wf-upu-ctrkill-rc-follower-upu-backup
  namespace: default

renderer: modular_chaos

targets:
  - id: rc_followers
    finder: rc_followers
  - id: rc_component
    finder: rc_pods
  - id: upu_main_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-1"
      - "dupf-pod-upu-2"
      - "dupf-pod-upu-3"
      - "dupf-pod-upu-5"
      - "dupf-pod-upu-6"
      - "dupf-pod-upu-7"
      - "dupf-pod-upu-9"
      - "dupf-pod-upu-10"
      - "dupf-pod-upu-11"

  - id: upu_backup_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-4"
      - "dupf-pod-upu-8"
      - "dupf-pod-upu-12"
stages:
  - mode: parallel
    faults:
      - type: network_delay
        selectors:
          from: rc_component
          to: upu_backup_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: rc_component
          to: upu_backup_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: container_kill
        target: rc_followers
        delay: 0s~1s
        duration: 1s
        containerNames: [registry-center]
        expand:
          mode: random
          count: 1
      - type: container_kill
        target: upu_backup_pool
        delay: 0s~1s
        duration: 1s
        containerNames: [upu]
        expand:
          mode: random
          count: 1

wait_seconds: 40
cleanup: true
