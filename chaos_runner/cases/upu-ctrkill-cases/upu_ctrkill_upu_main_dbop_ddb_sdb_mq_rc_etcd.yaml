name: upu_ctrkill_upu_main_dbop_ddb_sdb_mq_rc_etcd

workflow:
  name: wf-upu-ctrkill-upu-main-dbop-ddb-sdb-mq-rc-etcd
  namespace: default

renderer: modular_chaos

targets:
  - id: db_operator
    finder: by_label
    label: "app.kubernetes.io/instance: dupf-db-operator"
  - id: ddb_shard0_master
    finder: ddb_shard_master
    shard: "0"
  - id: ddb_all
    finder: ddb_pods
    role: all
  - id: sdb_master
    finder: sdb_master
  - id: sdb_pods
    finder: sdb_pods
  - id: mq_proxy
    finder: by_label
    label: "app.kubernetes.io/component: dupf-pod-mq-proxy"
  - id: rc_leader
    finder: rc_leader
  - id: rc_component
    finder: rc_pods
  - id: etcd_pods
    finder: etcd_pods
  - id: upu_main_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-1"
      - "dupf-pod-upu-2"
      - "dupf-pod-upu-3"
      - "dupf-pod-upu-5"
      - "dupf-pod-upu-6"
      - "dupf-pod-upu-7"
      - "dupf-pod-upu-9"
      - "dupf-pod-upu-10"
      - "dupf-pod-upu-11"

  - id: upu_backup_pool
    finder: by_label_values
    label_key: "app.kubernetes.io/component"
    label_values:
      - "dupf-pod-upu-4"
      - "dupf-pod-upu-8"
      - "dupf-pod-upu-12"
stages:
  - mode: parallel
    faults:
      - type: network_delay
        selectors:
          from: db_operator
          to: upu_main_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: db_operator
          to: upu_main_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: network_delay
        selectors:
          from: ddb_all
          to: upu_main_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: ddb_all
          to: upu_main_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: network_delay
        selectors:
          from: sdb_pods
          to: upu_main_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: sdb_pods
          to: upu_main_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: network_delay
        selectors:
          from: mq_proxy
          to: upu_main_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: mq_proxy
          to: upu_main_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: network_delay
        selectors:
          from: rc_component
          to: upu_main_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: rc_component
          to: upu_main_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: network_delay
        selectors:
          from: etcd_pods
          to: upu_main_pool
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 1000ms
      - type: network_loss
        selectors:
          from: etcd_pods
          to: upu_main_pool
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"
      - type: container_kill
        target: upu_main_pool
        delay: 0s~1s
        duration: 1s
        containerNames: [upu]
        expand:
          mode: random
          count: 1
      - type: container_kill
        target: db_operator
        delay: 0s~1s
        duration: 1s
        containerNames: [manager]
        expand:
          mode: random
          count: 1
      - type: container_kill
        target: ddb_shard0_master
        delay: 0s~1s
        duration: 1s
        containerNames: [redis]
      - type: container_kill
        target: sdb_master
        delay: 0s~1s
        duration: 1s
        containerNames: [sdb]
      - type: container_kill
        target: mq_proxy
        delay: 0s~1s
        duration: 1s
        containerNames: [mq-proxy-main]
        expand:
          mode: random
          count: 1
      - type: container_kill
        target: rc_leader
        delay: 0s~1s
        duration: 1s
        containerNames: [registry-center]
      - type: container_kill
        target: etcd_pods
        delay: 0s~1s
        duration: 1s
        containerNames: [etcd]
        expand:
          mode: random
          count: 1

wait_seconds: 40
cleanup: true
