name: upc_talker_rc_leader

workflow:
  name: wf-upc-talker-rc-leader
  namespace: default

renderer: modular_chaos

targets:
  - id: upc_talker
    finder: upc_talker

  - id: rc_leader
    finder: rc_leader

  - id: upc_component
    finder: by_label
    label: "app.kubernetes.io/component: dupf-pod-upc"

  - id: rc_component
    finder: by_label
    label: "app.kubernetes.io/component: dupf-registry-center"

stages:
  - mode: parallel
    faults:
      - type: network_delay
        selectors:
          from: upc_component
          to: rc_component
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 300ms

      - type: network_loss
        selectors:
          from: upc_component
          to: rc_component
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"

      - type: pod_kill
        target: upc_talker
        delay: 0ms
        duration: 1s

      - type: pod_kill
        target: rc_leader
        delay: 100ms
        duration: 1s

wait_seconds: 40
cleanup: true
