name: etcd_leader_upc_talker

workflow:
  name: wf-etcd-leader-upc-talker
  namespace: default

renderer: modular_chaos

targets:
  - id: etcd_leader
    finder: rc_etcd_leader

  - id: upc_talker
    finder: upc_talker

  - id: upc_component
    finder: by_label
    label: "app.kubernetes.io/component: dupf-pod-upc"

stages:
  - mode: parallel
    faults:
      - type: network_delay
        selectors:
          from: upc_component
          to: etcd_leader
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 300ms

      - type: network_loss
        selectors:
          from: upc_component
          to: etcd_leader
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"

      - type: pod_kill
        target: etcd_leader
        delay: 0ms
        duration: 1s

      - type: pod_kill
        target: upc_talker
        delay: 100ms
        duration: 1s

wait_seconds: 40
cleanup: true
