name: mq_upc_non_talker

workflow:
  name: wf-mq-upc-non-talker
  namespace: default

renderer: modular_chaos

targets:
  - id: mq_proxy
    finder: by_label
    label: "app.kubernetes.io/component: dupf-pod-mq-proxy"

  - id: upc_non_talkers
    finder: upc_non_talkers

  - id: upc_component
    finder: by_label
    label: "app.kubernetes.io/component: dupf-pod-upc"

stages:
  - mode: parallel
    faults:
      - type: network_delay
        selectors:
          from: upc_component
          to: mq_proxy
        direction: both
        duration: 30s
        delay:
          latency: 300ms
          jitter: 300ms

      - type: network_loss
        selectors:
          from: upc_component
          to: mq_proxy
        direction: both
        duration: 30s
        loss:
          loss: "10"
          correlation: "0"

      - type: pod_kill
        target: mq_proxy
        expand:
          mode: random
          count: 1
        delay: 0ms
        duration: 1s

      - type: pod_kill
        target: upc_non_talkers
        expand:
          mode: random
          count: 1
        delay: 100ms
        duration: 1s

wait_seconds: 40
cleanup: true
